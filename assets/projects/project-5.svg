<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#060912" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgP5)" />

  <!-- App Header -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="#141d30" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="68" cy="53" r="6" fill="#ef4444" /><circle cx="88" cy="53" r="6" fill="#f59e0b" /><circle cx="108" cy="53" r="6" fill="#10b981" />
  <text x="400" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Atelier UI — Component Library &amp; Design Tokens v3.4</text>

  <!-- Left Sidebar (Component tree) -->
  <g transform="translate(40, 96)">
    <rect width="180" height="460" rx="12" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">DESIGN SYSTEM</text>

    <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">✦ Color Tokens</text>
    <text x="20" y="95" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">✦ Typography Scale</text>
    <rect x="10" y="112" width="160" height="34" rx="8" fill="#1e293b" />
    <text x="20" y="134" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">✦ Buttons &amp; Badges</text>
    <text x="20" y="175" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Input Fields</text>
    <text x="20" y="205" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Modals &amp; Drawers</text>
    <text x="20" y="235" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Data Tables</text>
    <text x="20" y="265" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">✦ Navigation Bar</text>
  </g>

  <!-- Main Component Stage -->
  <g transform="translate(240, 96)">
    <rect width="520" height="460" rx="14" fill="#101828" stroke="#1e293b" stroke-width="1.5" />

    <!-- Section 1: Color Palette Swatches -->
    <text x="30" y="36" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Semantic Palette</text>
    <g transform="translate(30, 52)">
      <rect width="65" height="44" rx="8" fill="#38bdf8" />
      <text x="32" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">accent</text>

      <rect x="80" width="65" height="44" rx="8" fill="#2563eb" />
      <text x="112" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">primary</text>

      <rect x="160" width="65" height="44" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="192" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">surface</text>

      <rect x="240" width="65" height="44" rx="8" fill="#10b981" />
      <text x="272" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">success</text>

      <rect x="320" width="65" height="44" rx="8" fill="#f59e0b" />
      <text x="352" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">warning</text>

      <rect x="400" width="65" height="44" rx="8" fill="#ef4444" />
      <text x="432" y="60" fill="#64748b" font-family="monospace" font-size="10" text-anchor="middle">danger</text>
    </g>

    <!-- Section 2: Interactive Button Variants -->
    <text x="30" y="150" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Button Component Variants</text>
    <g transform="translate(30, 170)">
      <!-- Primary -->
      <rect width="130" height="42" rx="10" fill="#38bdf8" />
      <text x="65" y="26" fill="#020617" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Button Solid</text>

      <!-- Secondary -->
      <rect x="145" width="140" height="42" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
      <text x="215" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Button Outline</text>

      <!-- Ghost / Disabled -->
      <rect x="300" width="130" height="42" rx="10" fill="#162032" opacity="0.6" />
      <text x="365" y="26" fill="#64748b" font-family="system-ui, sans-serif" font-size="13" font-weight="500" text-anchor="middle">Button Disabled</text>
    </g>

    <!-- Section 3: Form Controls & Toggles -->
    <text x="30" y="260" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">Interactive Form Controls</text>
    <g transform="translate(30, 280)">
      <!-- Input -->
      <rect width="250" height="44" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <text x="18" y="27" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13">john@enterprise.io</text>
      <circle cx="230" cy="22" r="7" fill="#10b981" />

      <!-- Switches -->
      <g transform="translate(280, 8)">
        <!-- Switch on -->
        <rect width="54" height="28" rx="14" fill="#38bdf8" />
        <circle cx="40" cy="14" r="10" fill="#020617" />
        <text x="66" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12">Dark Theme</text>
      </g>
    </g>

    <!-- Section 4: Code preview snippet -->
    <g transform="translate(30, 360)">
      <rect width="460" height="75" rx="8" fill="#090d16" stroke="#1e293b" />
      <text x="16" y="26" fill="#64748b" font-family="monospace" font-size="11">// Import semantic button</text>
      <text x="16" y="46" fill="#38bdf8" font-family="monospace" font-size="12">import</text>
      <text x="65" y="46" fill="#f8fafc" font-family="monospace" font-size="12">{ Button } from '@atelier/ui';</text>
      <text x="16" y="64" fill="#60a5fa" font-family="monospace" font-size="12">&lt;Button variant="primary" size="lg"&gt;Get Started&lt;/Button&gt;</text>
    </g>
  </g>
</svg>
