<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgP4)" />

  <!-- Background Ambience -->
  <circle cx="400" cy="300" r="220" fill="#2563eb" opacity="0.12" />

  <!-- Centered Smartphone Frame -->
  <g transform="translate(260, 40)">
    <!-- Phone body -->
    <rect width="280" height="520" rx="36" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Dynamic Island / Speaker notch -->
    <rect x="95" y="14" width="90" height="20" rx="10" fill="#020617" />
    <circle cx="165" cy="24" r="4" fill="#1e293b" />

    <!-- Screen inner -->
    <g transform="translate(18, 48)">
      <!-- App Header -->
      <circle cx="20" cy="20" r="16" fill="#1e293b" />
      <text x="20" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">FS</text>
      <text x="46" y="18" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Good evening,</text>
      <text x="46" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Felipe Silva</text>
      <circle cx="225" cy="20" r="14" fill="#1e293b" />
      <text x="225" y="24" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">🔔</text>

      <!-- Debit / Credit Card Card -->
      <g transform="translate(0, 52)">
        <rect width="244" height="135" rx="16" fill="url(#cardGrad)" />
        <text x="18" y="28" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="600" opacity="0.85">NovaPay Platinum</text>
        <circle cx="215" cy="24" r="10" fill="#ffffff" opacity="0.3" />
        <circle cx="225" cy="24" r="10" fill="#ffffff" opacity="0.4" />

        <text x="18" y="70" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" opacity="0.8">Total Balance</text>
        <text x="18" y="96" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">$24,850.50</text>
        <text x="18" y="122" fill="#ffffff" font-family="monospace" font-size="11" opacity="0.85">•••• 8824</text>
      </g>

      <!-- Action Buttons Row -->
      <g transform="translate(0, 202)">
        <circle cx="30" cy="22" r="20" fill="#1e293b" />
        <text x="30" y="28" fill="#38bdf8" font-size="16" text-anchor="middle">↑</text>
        <text x="30" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Send</text>

        <circle cx="92" cy="22" r="20" fill="#1e293b" />
        <text x="92" y="28" fill="#38bdf8" font-size="16" text-anchor="middle">↓</text>
        <text x="92" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Receive</text>

        <circle cx="154" cy="22" r="20" fill="#1e293b" />
        <text x="154" y="27" fill="#38bdf8" font-size="15" text-anchor="middle">⚡</text>
        <text x="154" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Pix</text>

        <circle cx="214" cy="22" r="20" fill="#1e293b" />
        <text x="214" y="26" fill="#38bdf8" font-size="14" text-anchor="middle">📊</text>
        <text x="214" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Stats</text>
      </g>

      <!-- Recent Transactions List -->
      <g transform="translate(0, 275)">
        <text x="4" y="16" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Recent Transactions</text>

        <!-- Tx 1 -->
        <g transform="translate(0, 28)">
          <rect width="244" height="42" rx="10" fill="#1e293b" />
          <circle cx="22" cy="21" r="12" fill="#0f172a" />
          <text x="22" y="25" fill="#38bdf8" font-size="12" text-anchor="middle">🛒</text>
          <text x="44" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Apple Store</text>
          <text x="44" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Gadgets</text>
          <text x="230" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">-$1,299</text>
        </g>

        <!-- Tx 2 -->
        <g transform="translate(0, 78)">
          <rect width="244" height="42" rx="10" fill="#1e293b" />
          <circle cx="22" cy="21" r="12" fill="#0f172a" />
          <text x="22" y="25" fill="#10b981" font-size="12" text-anchor="middle">💼</text>
          <text x="44" y="18" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="500">Salary Deposit</text>
          <text x="44" y="32" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Horizon Tech</text>
          <text x="230" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="end">+$6,400</text>
        </g>
      </g>
    </g>
  </g>
</svg>
