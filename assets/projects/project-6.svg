<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09101d" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgP6)" />

  <!-- App Header -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="#141c2c" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="68" cy="53" r="6" fill="#ef4444" /><circle cx="88" cy="53" r="6" fill="#f59e0b" /><circle cx="108" cy="53" r="6" fill="#10b981" />
  <text x="400" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">CloudForge — Ephemeral Environments Orchestrator (Cluster: k8s-us-central)</text>

  <!-- Topology Canvas Area -->
  <g transform="translate(40, 96)">
    <rect width="720" height="230" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Active Pods &amp; Micro-Clusters</text>

    <!-- Cluster Nodes -->
    <g transform="translate(40, 60)">
      <!-- Node 1 -->
      <rect width="180" height="130" rx="10" fill="#162032" stroke="#38bdf8" stroke-width="2" />
      <text x="16" y="28" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">pod-frontend-pr-42</text>
      <text x="16" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CPU: 0.2 / 1.0 vCPU</text>
      <text x="16" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Memory: 256MB / 1GB</text>
      <rect x="16" y="88" width="80" height="22" rx="6" fill="#065f46" />
      <text x="56" y="103" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RUNNING</text>

      <!-- Connection line -->
      <path d="M 180 65 L 260 65" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Node 2 -->
      <rect x="260" width="180" height="130" rx="10" fill="#162032" stroke="#2563eb" stroke-width="1.5" />
      <text x="276" y="28" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">pod-api-gateway</text>
      <text x="276" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">CPU: 0.6 / 2.0 vCPU</text>
      <text x="276" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Memory: 512MB / 2GB</text>
      <rect x="276" y="88" width="80" height="22" rx="6" fill="#065f46" />
      <text x="316" y="103" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">RUNNING</text>

      <!-- Connection line -->
      <path d="M 440 65 L 500 65" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" />

      <!-- Node 3 -->
      <rect x="500" width="160" height="130" rx="10" fill="#162032" stroke="#334155" stroke-width="1.5" />
      <text x="516" y="28" fill="#f8fafc" font-family="monospace" font-size="12" font-weight="bold">redis-cluster-0</text>
      <text x="516" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Replicas: 3 / 3</text>
      <text x="516" y="72" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Key hits: 99.4%</text>
      <rect x="516" y="88" width="80" height="22" rx="6" fill="#065f46" />
      <text x="556" y="103" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SYNCED</text>
    </g>
  </g>

  <!-- Live Terminal Logs -->
  <g transform="translate(40, 346)">
    <rect width="720" height="210" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="1.5" />
    <rect width="720" height="32" rx="14" fill="#141c2c" />
    <rect y="22" width="720" height="10" fill="#141c2c" />
    <text x="20" y="21" fill="#64748b" font-family="monospace" font-size="12">stdout / tail -f build.log</text>

    <text x="20" y="58" fill="#10b981" font-family="monospace" font-size="12">[18:42:01] INFO  Pulling image gcr.io/cloudforge-env/runtime:v4.2.1...</text>
    <text x="20" y="82" fill="#10b981" font-family="monospace" font-size="12">[18:42:04] INFO  Mounting volume /data/secrets via Vault CSI Provider</text>
    <text x="20" y="106" fill="#38bdf8" font-family="monospace" font-size="12">[18:42:07] DEPLOY Container started in 1.42s (Ingress route: https://pr-42.preview.dev)</text>
    <text x="20" y="130" fill="#94a3b8" font-family="monospace" font-size="12">[18:42:10] PROBE HTTP GET /healthz 200 OK [12ms]</text>
    <text x="20" y="154" fill="#f8fafc" font-family="monospace" font-size="12">[18:42:11] READY Ready to accept staging traffic. Idle TTL set to 4 hours.</text>
    <!-- blinking cursor -->
    <rect x="20" y="172" width="10" height="16" fill="#38bdf8" />
  </g>
</svg>
