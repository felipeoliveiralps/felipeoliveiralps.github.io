<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgP2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060a12" />
    </linearGradient>
    <linearGradient id="rocGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bgP2)" />

  <!-- App Header -->
  <rect x="40" y="30" width="720" height="46" rx="10" fill="#151e33" stroke="#22304d" stroke-width="1" />
  <circle cx="68" cy="53" r="6" fill="#ef4444" /><circle cx="88" cy="53" r="6" fill="#f59e0b" /><circle cx="108" cy="53" r="6" fill="#10b981" />
  <text x="400" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">MLflow / Scikit-Learn — Churn_Prediction_Pipeline_v2</text>

  <!-- Metric Stat Cards Row -->
  <g transform="translate(40, 96)">
    <!-- Card 1 -->
    <rect width="165" height="90" rx="10" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="16" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">ROC-AUC Score</text>
    <text x="16" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">0.924</text>
    <text x="105" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">XGBoost</text>

    <!-- Card 2 -->
    <rect x="185" width="165" height="90" rx="10" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="201" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Recall (Churn)</text>
    <text x="201" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">88.6%</text>
    <text x="285" y="60" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Alta sensib.</text>

    <!-- Card 3 -->
    <rect x="370" width="165" height="90" rx="10" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="386" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">F1-Score Balanceado</text>
    <text x="386" y="60" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">0.862</text>
    <text x="475" y="60" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Ótimo</text>

    <!-- Card 4 -->
    <rect x="555" width="165" height="90" rx="10" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="571" y="28" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">Amostras Validadas</text>
    <text x="571" y="60" fill="#818cf8" font-family="system-ui, sans-serif" font-size="24" font-weight="bold">24.090</text>
    <circle cx="685" cy="53" r="6" fill="#10b981" />
  </g>

  <!-- ROC Curve Chart Area -->
  <g transform="translate(40, 206)">
    <rect width="460" height="350" rx="12" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="24" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Curva ROC (Receiver Operating Characteristic)</text>
    <text x="24" y="52" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">True Positive Rate vs. False Positive Rate</text>

    <!-- Grid lines -->
    <line x1="40" y1="90" x2="420" y2="90" stroke="#1e293b" />
    <line x1="40" y1="160" x2="420" y2="160" stroke="#1e293b" />
    <line x1="40" y1="230" x2="420" y2="230" stroke="#1e293b" />
    <line x1="40" y1="300" x2="420" y2="300" stroke="#334155" />
    <line x1="40" y1="90" x2="40" y2="300" stroke="#334155" />

    <!-- Diagonal random guess line (dash) -->
    <line x1="40" y1="300" x2="420" y2="90" stroke="#475569" stroke-width="2" stroke-dasharray="4 4" />

    <!-- ROC Fill Area -->
    <path d="M 40 300 Q 60 110, 160 100 T 420 90 L 420 300 Z" fill="url(#rocGrad)" />
    <!-- XGBoost ROC curve -->
    <path d="M 40 300 Q 60 110, 160 100 T 420 90" fill="none" stroke="#38bdf8" stroke-width="3.5" />
    <!-- Random Forest ROC curve -->
    <path d="M 40 300 Q 80 140, 180 120 T 420 90" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="5 3" />

    <!-- Legend -->
    <text x="240" y="270" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">● XGBoost (AUC = 0.92)</text>
    <text x="240" y="290" fill="#818cf8" font-family="system-ui, sans-serif" font-size="12">● Random Forest (AUC = 0.88)</text>
  </g>

  <!-- Side Feature Importance Panel -->
  <g transform="translate(520, 206)">
    <rect width="240" height="350" rx="12" fill="#101828" stroke="#1e293b" stroke-width="1.5" />
    <text x="20" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="600">Feature Importance</text>

    <!-- Bar 1 -->
    <g transform="translate(20, 60)">
      <text x="0" y="14" fill="#f1f5f9" font-family="monospace" font-size="11">dias_inativo_recentes</text>
      <rect y="22" width="200" height="8" rx="4" fill="#1e293b" />
      <rect y="22" width="180" height="8" rx="4" fill="#38bdf8" />
    </g>

    <!-- Bar 2 -->
    <g transform="translate(20, 115)">
      <text x="0" y="14" fill="#f1f5f9" font-family="monospace" font-size="11">horas_jogadas_mes</text>
      <rect y="22" width="200" height="8" rx="4" fill="#1e293b" />
      <rect y="22" width="150" height="8" rx="4" fill="#38bdf8" />
    </g>

    <!-- Bar 3 -->
    <g transform="translate(20, 170)">
      <text x="0" y="14" fill="#f1f5f9" font-family="monospace" font-size="11">partidas_por_semana</text>
      <rect y="22" width="200" height="8" rx="4" fill="#1e293b" />
      <rect y="22" width="120" height="8" rx="4" fill="#38bdf8" />
    </g>

    <!-- Bar 4 -->
    <g transform="translate(20, 225)">
      <text x="0" y="14" fill="#f1f5f9" font-family="monospace" font-size="11">tickets_suporte_abertos</text>
      <rect y="22" width="200" height="8" rx="4" fill="#1e293b" />
      <rect y="22" width="85" height="8" rx="4" fill="#818cf8" />
    </g>

    <!-- Bar 5 -->
    <g transform="translate(20, 280)">
      <text x="0" y="14" fill="#f1f5f9" font-family="monospace" font-size="11">tempo_de_assinatura</text>
      <rect y="22" width="200" height="8" rx="4" fill="#1e293b" />
      <rect y="22" width="60" height="8" rx="4" fill="#818cf8" />
    </g>
  </g>
</svg>
